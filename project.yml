name: GBAEmulator
options:
  developmentLanguage: zh-Hans
  bundleIdPrefix: com.gbaemulator
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_OBJC_BRIDGING_HEADER: "GBAEmulator/Core/Emulator/GBAEmulator-Bridging-Header.h"
    HEADER_SEARCH_PATHS:
      - "$(PROJECT_DIR)/GBAEmulator/mGBA/include"
    LIBRARY_SEARCH_PATHS:
      - "$(PROJECT_DIR)/GBAEmulator/mGBA/lib/$(PLATFORM_NAME)"
    OTHER_LDFLAGS:
      - "-lmgba"
      - "-lz"
    CLANG_ENABLE_MODULES: YES

targets:
  GBAEmulator:
    type: application
    platform: iOS
    sources:
      - path: GBAEmulator
        excludes:
          - "mGBA/**"
          - "Info.plist"
    resources:
      - path: GBAEmulator/Resources
    settings:
      base:
        INFOPLIST_FILE: GBAEmulator/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gbaemulator.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies: []
    preBuildScripts:
      - name: "Build mGBA"
        script: |
          if [ ! -f "${PROJECT_DIR}/GBAEmulator/mGBA/lib/${PLATFORM_NAME}/libmgba.a" ]; then
            echo "Building mGBA..."
            bash "${PROJECT_DIR}/GBAEmulator/mGBA/build-ios.sh"
          fi
        basedOnDependencyAnalysis: false

  GBAEmulatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GBAEmulatorTests
    dependencies:
      - target: GBAEmulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gbaemulator.tests
        GENERATE_INFOPLIST_FILE: YES
